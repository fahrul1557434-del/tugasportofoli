<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahrul | Junior Network Engineer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

:root {
    --bg: #07111f;
    --card: #0d1b2d;
    --blue: #38bdf8;
    --text: #f1f5f9;
    --muted: #94a3b8;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(#16304a22 1px, transparent 1px),
      linear-gradient(90deg, #16304a22 1px, transparent 1px);
    background-size: 45px 45px;
    pointer-events: none;
    z-index: -1;
}

a {
    color: inherit;
    text-decoration: none;
}

/* NAVBAR */

nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 20px 9%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #07111fdd;
    backdrop-filter: blur(15px);
    z-index: 100;
    border-bottom: 1px solid #ffffff0d;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    color: var(--blue);
}

.logo span {
    color: white;
}

.nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
}

.nav-links a {
    color: var(--muted);
    font-size: 13px;
    transition: .3s;
}

.nav-links a:hover {
    color: var(--blue);
}

.menu-btn {
    display: none;
    background: none;
    border: none;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

/* HERO */

.hero {
    min-height: 100vh;
    padding: 150px 9% 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 50px;
}

.hero-content {
    max-width: 650px;
}

.tag {
    color: var(--blue);
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 25px;
}

.hero h1 {
    font-size: clamp(40px, 6vw, 70px);
    line-height: 1.1;
    margin-bottom: 20px;
}

.hero h1 span {
    color: var(--blue);
}

.hero h3 {
    color: #cbd5e1;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 20px;
}

.hero p {
    color: var(--muted);
    line-height: 1.9;
    font-size: 14px;
    max-width: 550px;
}

.buttons {
    display: flex;
    gap: 15px;
    margin-top: 35px;
}

.btn {
    padding: 14px 25px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    transition: .3s;
}

.primary {
    background: var(--blue);
    color: #07111f;
}

.primary:hover {
    background: white;
    transform: translateY(-4px);
}

.secondary {
    border: 1px solid #334155;
    color: white;
}

.secondary:hover {
    border-color: var(--blue);
    color: var(--blue);
}
